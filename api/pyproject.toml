[project]
name = "aura-api"
version = "0.1.0"
description = "AURA marketing pipeline API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary]",
  "pymysql",
  "httpx",
  "duckdb>=1.4.0",
  "beautifulsoup4>=4.12",
  "dnspython>=2.7",
  "python-dotenv",
  "python-multipart",
  "openai",
  "google-genai>=2.24.0",
  "fal-client>=1.0.3",
]

[project.optional-dependencies]
lead-browser = ["crawl4ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "db.py", "schemas.py", "graph.py", "routes", "agents", "services"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
