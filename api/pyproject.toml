[project]
name = "aura-api"
version = "0.1.0"
description = "AURA marketing pipeline API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary]",
  "httpx",
  "python-dotenv",
  "google-genai>=2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "db.py", "schemas.py", "graph.py", "routes", "agents"]
