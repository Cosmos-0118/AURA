services:
  intelligence:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      INTEL_HOST: 0.0.0.0
      INTEL_PORT: 8787
      INTEL_DB_PATH: /app/data/intelligence.db
      INTEL_WEBHOOK_TOKEN: ${INTEL_WEBHOOK_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CHANGEDETECTION_API_URL: http://changedetection:5000
      CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY:-}
    volumes:
      - intelligence-data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - changedetection

  worker:
    build: .
    command: ["python", "-m", "competitor_intelligence", "worker"]
    restart: unless-stopped
    environment:
      INTEL_HOST: 0.0.0.0
      INTEL_PORT: 8787
      INTEL_DB_PATH: /app/data/intelligence.db
      INTEL_SCAN_INTERVAL: ${INTEL_SCAN_INTERVAL:-900}
      INTEL_WEBHOOK_TOKEN: ${INTEL_WEBHOOK_TOKEN:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      CHANGEDETECTION_API_URL: http://changedetection:5000
      CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    volumes:
      - intelligence-data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - intelligence

  changedetection:
    build:
      context: ./changedetection-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CHANGEDETECTION_PORT:-5001}:5000"
    environment:
      BASE_URL: ${CHANGEDETECTION_BASE_URL:-http://localhost:5001}
      PLAYWRIGHT_DRIVER_URL: ${PLAYWRIGHT_DRIVER_URL:-ws://browser-chrome:3000/?headful=true&--disable-http2&--disable-quic&--window-size=1920,1080}
      FETCH_WORKERS: ${FETCH_WORKERS:-1}
      # The upstream image disables visual screenshot diffing by default.
      # Keep it available alongside the text processor used by AURA webhooks.
      DISABLED_PROCESSORS: ${DISABLED_PROCESSORS:-}
    volumes:
      - changedetection-data:/datastore
    depends_on:
      browser-chrome:
        condition: service_healthy

  browser-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    hostname: browser-chrome
    restart: unless-stopped
    init: true
    shm_size: 2gb
    environment:
      MAX_CONCURRENT_CHROME_PROCESSES: ${MAX_CONCURRENT_CHROME_PROCESSES:-2}
      WS_PING_TIMEOUT: ${WS_PING_TIMEOUT:-60}
      CONNECTION_QUEUE_TIMEOUT: ${CONNECTION_QUEUE_TIMEOUT:-300}
      LOG_LEVEL: ${BROWSER_LOG_LEVEL:-INFO}
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "python3", "/usr/src/app/docker-health-check.py", "--host", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  searxng:
    image: searxng/searxng:latest
    profiles: ["discovery"]
    ports:
      - "8080:8080"
    environment:
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_IMAGE_PROXY: "false"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./config/searxng/limiter.toml:/etc/searxng/limiter.toml:ro

  rsshub:
    image: diygod/rsshub:latest
    profiles: ["social"]
    ports:
      - "1200:1200"

volumes:
  intelligence-data:
  changedetection-data:
  searxng-data:
