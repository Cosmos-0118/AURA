<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="JA Assure competitor intelligence monitor" />
    <meta name="theme-color" content="#fafafa" />
    <title>JA Assure · Competitor Intelligence</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script>
      try {
        var t = localStorage.getItem('ja-intel-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="JA Assure competitor intelligence home">
          <span class="brand-mark">JA</span>
          <span>
            <strong>JA Assure</strong>
            <small>Competitor intelligence</small>
          </span>
        </a>
        <div class="topbar-actions">
          <button id="theme-toggle" type="button" class="button button-quiet theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-icon-moon" aria-hidden="true">☾</span><span class="theme-icon-sun" aria-hidden="true">☀</span> <span data-theme-label>Dark</span></button>
          <a class="button button-quiet" href="/sources">Sources</a>
          <a class="button button-quiet" href="/watchlist">Watchlist</a>
          <button id="sync-changes" class="button button-quiet">Sync 5001 changes</button>
          <button id="scan-all" class="button button-primary">Scan watchlist</button>
        </div>
      </header>

      <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

      <section class="feed">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Prioritised feed</p>
            <h2>Detected changes</h2>
          </div>
          <span id="event-count" class="muted">0 events</span>
        </div>

        <form id="filters" class="filters" aria-label="Filter intelligence events">
            <label class="search-field">
              <span class="sr-only">Search events</span>
              <input id="filter-search" name="search" type="search" placeholder="Search competitor, summary, or evidence…" />
            </label>
            <label>
              <span class="sr-only">Brand</span>
              <select id="filter-brand" name="brand_id">
                <option value="">All brands</option>
                <option value="jade">Jade</option>
                <option value="doctorshield">DoctorShield</option>
                <option value="jaguar">Jaguar Transit</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Impact</span>
              <select id="filter-impact" name="impact">
                <option value="">All impact</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Country</span>
              <select id="filter-country" name="country">
                <option value="">All markets</option>
                <option value="SG">Singapore</option>
                <option value="MY">Malaysia</option>
                <option value="HK">Hong Kong</option>
                <option value="ID">Indonesia</option>
                <option value="TH">Thailand</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Change type</span>
              <select id="filter-type" name="change_type">
                <option value="">All change types</option>
                <option value="price_change">Price change</option>
                <option value="new_product">New product</option>
                <option value="new_market">New market</option>
                <option value="coverage_change">Coverage change</option>
                <option value="partnership">Partnership</option>
                <option value="positioning_change">Positioning</option>
                <option value="social_post">Social post</option>
              </select>
            </label>
            <label>
              <span class="sr-only">Source</span>
              <select id="filter-source" name="source">
                <option value="">All sources</option>
                <option value="website">Website</option>
                <option value="pricing">Pricing</option>
                <option value="changedetection">Changedetection</option>
                <option value="rsshub">RSSHub</option>
                <option value="news">News</option>
              </select>
            </label>
            <button id="clear-filters" type="button" class="button button-quiet">Clear</button>
          </form>

          <div id="events" class="events" aria-live="polite"></div>
      </section>
    </main>

    <div id="scan-overlay" class="scan-overlay" hidden aria-hidden="true">
      <section id="scan-card" class="scan-card" role="dialog" aria-modal="true" aria-labelledby="scan-title" aria-describedby="scan-copy" tabindex="-1">
        <div class="scan-spinner" aria-hidden="true"></div>
        <h2 id="scan-title">Scanning</h2>
        <p id="scan-copy">Checking sources for changes. This may take a few seconds.</p>
        <div class="scan-progress" aria-hidden="true"><span></span></div>
      </section>
    </div>

    <script src="/static/theme.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
