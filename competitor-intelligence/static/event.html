<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="JA Assure competitor intelligence monitor — event detail" />
    <meta name="theme-color" content="#fafafa" />
    <title>Event · Competitor Intelligence</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script>
      try {
        var t = localStorage.getItem('ja-intel-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="JA Assure competitor intelligence home">
          <span class="brand-mark">JA</span>
          <span>
            <strong>JA Assure</strong>
            <small>Competitor intelligence</small>
          </span>
        </a>
        <div class="topbar-actions">
          <button id="theme-toggle" type="button" class="button button-quiet theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch to dark theme"><span class="theme-icon-moon" aria-hidden="true">☾</span><span class="theme-icon-sun" aria-hidden="true">☀</span> <span data-theme-label>Dark</span></button>
          <a class="button button-quiet" href="/sources">Sources</a>
          <a class="button button-quiet" href="/watchlist">Watchlist</a>
        </div>
      </header>

      <a class="back-link" href="/">← Back to feed</a>

      <div id="event-detail" class="event-page" aria-live="polite">
        <div class="empty-state">Loading event…</div>
      </div>

      <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>
    </main>

    <script src="/static/theme.js" defer></script>
    <script src="/static/event.js" defer></script>
  </body>
</html>
